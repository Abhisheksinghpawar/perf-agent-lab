# perf-agent-lab configuration. Every value can be overridden with --set section.key=value on the CLI.

[target]
repo_url        = "https://github.com/mybatis/jpetstore-6.git"
branch          = "master"
ref             = ""                          # pin a commit SHA or tag for fully reproducible runs ("" = latest of branch)
workdir         = "work/jpetstore-6"          # where the target repo is cloned (git-ignored)
base_url        = "http://localhost:8080/jpetstore"
health_path     = "/catalog"
app_package     = "org.mybatis.jpetstore"      # stack frames from this package are "our" code
build_timeout_s = 900
startup_timeout_s = 300

[smoke]                       # sanity test: runs BEFORE the real load test; a failure triggers self-healing
users            = 1
duration_s       = 20
min_requests     = 12
max_error_rate   = 0.0
p95_ms_limit     = 2000
max_heal_attempts = 3

[load]                        # the real test: short on purpose (1 minute)
users      = 100
spawn_rate = 20
duration_s = 60

[analysis]
window_s         = 5          # time-bucket size for spike detection
spike_factor     = 2.5        # a bucket is a spike when p95 > factor * median(p95) ...
spike_min_ms     = 250        # ... and above this absolute floor
cpu_saturation_pct = 85
regression_pct   = 25         # endpoint p95 vs baseline
regression_min_ms = 50
error_rate_alert = 0.01

[llm]                         # any OpenAI-compatible API; defaults to Groq (free tier works)
base_url     = "https://api.groq.com/openai/v1"
model        = "openai/gpt-oss-20b"
api_key_env  = "GROQ_API_KEY"
max_tool_turns = 8
max_output_tokens = 1500
timeout_s    = 90

[publish]
reports_dir = "reports"
site_dir    = "site"
keep_runs   = 30
