name: ci
on:
  push:
    paths-ignore: ["memory/**", "reports/**"]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (analysis, logs, validator, memory, report, agent loop)
        run: python -m unittest discover -s tests -v
